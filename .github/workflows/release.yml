name: release

# 推送语义化标签时触发，也可手动指定同格式标签。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.4.1'
        required: true
        type: string

permissions:
  contents: write   # 创建 / 上传 Release 资源所需

jobs:
  release_metadata:
    name: validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z, for example v0.4.1."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # tauri-action 对已存在的同名 Release 只上传资产、不更新 body（其源码行为），
      # 因此这里用 gh api 直接 PATCH 发布说明，保证重复发版时说明也同步更新。
      # 不涉及 GITHUB_OUTPUT 多行 heredoc，规避本仓库 runner 的定界符问题。
      - name: 更新已存在 Release 的发布说明
        run: |
          notes_file=".github/release-notes/${RELEASE_TAG#v}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error file=$notes_file::未找到版本发布说明文件，请先在 .github/release-notes/ 下创建后重新触发"
            exit 1
          fi
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id 2>/dev/null || true)"
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f body="$(cat "$notes_file")" >/dev/null
            echo "已更新 Release #${release_id} 的发布说明"
          else
            echo "Release 尚不存在，说明将由 tauri-action 创建时写入"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  quality_gate:
    name: quality gate (typecheck + smoke + rust tests)
    needs: release_metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖（Tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 转换冒烟测试
        run: node scripts/smoke-convert.mjs

      - name: Rust 单元测试
        run: |
          output_file="$(mktemp)"
          if ! cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$output_file"; then
            # 编译错误尾部写入 annotation，页面 Annotations 区可直接查看
            summary="$(tail -n 80 "$output_file" | tr '\n' ' ' | cut -c1-1200)"
            echo "::error file=src-tauri/Cargo.toml::cargo test 失败：${summary}"
            exit 1
          fi

  publish:
    needs: [release_metadata, quality_gate]
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # 单个平台失败不影响其它平台继续构建
      matrix:
        include:
          # Windows x64
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,  label: windows-x64, args: '--bundles nsis' }
          # macOS（Apple Silicon + Intel）
          - { runner: macos-latest,    target: aarch64-apple-darwin,    label: macos-arm64, args: '' }
          - { runner: macos-latest,    target: x86_64-apple-darwin,     label: macos-x64, args: '' }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链（含目标平台）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.release_metadata.outputs.tag }}
          releaseName: MarkFlow ${{ needs.release_metadata.outputs.version }}
          # 发布说明内联维护（GITHUB_OUTPUT 多行 heredoc 在本仓库 runner 不可靠），
          # 发版时同步更新此处与 .github/release-notes/<version>.md。
          releaseBody: |
            ## MarkFlow ${{ needs.release_metadata.outputs.version }}

            ### 性能：大文档优化

            - 预览渲染防抖阈值从 100 万字符降到 5 万，输入停止 350ms 后才重渲染。
            - 超过 20 万字符的文档预览切换为纯静态渲染（跳过表格增强与代码高亮），大幅降低单次渲染成本。
            - 行号栏虚拟化：5000 行以上只渲染可视窗口内的行号，滚动不再随文档规模变慢。
            - 滚动锚点、字数统计、会话持久化同步降频/兜底，超大文档不再卡死。

            ### 修复

            - 关闭窗口前等待自动保存，并修复关闭按钮可能失效的问题（补全窗口销毁权限与兜底）。
            - 预览表格编辑按源码行号定位：混排原始 HTML 表格时不再改错表格或报错。
            - 手动保存与自动保存共用串行写队列，避免旧快照覆盖新内容。
            - 支持重做：Ctrl+Y 与 Ctrl/Command+Shift+Z 接入自定义撤销栈。
            - 文本读取支持 GBK/GB18030 编码回退；UTF-8 BOM 自动剥离。
            - 图片覆盖保存失败时自动恢复原图；复制图片前先做大小预检。
            - 修复 MSI 安装包构建失败：文件关联描述改用中文代码页（WiX zh-CN），中文 Windows 下不再报 LGHT0311 编码错误。

            ### 其他

            - 恢复导出 Word 时图片占位提示；有序列表编号在导出 Word 时按列表重置。
            - 发布流水线新增质量门禁（类型检查、冒烟测试、Rust 单元测试），测试不过不发布。
            - 打开外链仅允许 http/https/mailto/tel/ftp，拒绝启动本地程序。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}