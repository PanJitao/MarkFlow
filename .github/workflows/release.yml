name: release

# 推送语义化标签时触发，也可手动指定同格式标签。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.4.1'
        required: true
        type: string

permissions:
  contents: write   # 创建 / 上传 Release 资源所需

jobs:
  release_metadata:
    name: validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z, for example v0.4.1."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # tauri-action 对已存在的同名 Release 只上传资产、不更新 body（其源码行为），
      # 因此这里用 gh api 直接 PATCH 发布说明，保证重复发版时说明也同步更新。
      # 不涉及 GITHUB_OUTPUT 多行 heredoc，规避本仓库 runner 的定界符问题。
      - name: 更新已存在 Release 的发布说明
        run: |
          notes_file=".github/release-notes/${RELEASE_TAG#v}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error file=$notes_file::未找到版本发布说明文件，请先在 .github/release-notes/ 下创建后重新触发"
            exit 1
          fi
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id 2>/dev/null || true)"
          if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f body="$(cat "$notes_file")" >/dev/null
            echo "已更新 Release #${release_id} 的发布说明"
          else
            echo "Release 尚不存在，说明将由 tauri-action 创建时写入"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  quality_gate:
    name: quality gate (typecheck + smoke + rust tests)
    needs: release_metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖（Tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 转换冒烟测试
        run: node scripts/smoke-convert.mjs

      - name: Rust 单元测试
        run: |
          output_file="$(mktemp)"
          if ! cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$output_file"; then
            # 编译错误尾部写入 annotation，页面 Annotations 区可直接查看
            summary="$(tail -n 80 "$output_file" | tr '\n' ' ' | cut -c1-1200)"
            echo "::error file=src-tauri/Cargo.toml::cargo test 失败：${summary}"
            exit 1
          fi

  publish:
    needs: [release_metadata, quality_gate]
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # 单个平台失败不影响其它平台继续构建
      matrix:
        include:
          # Windows x64
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,  label: windows-x64, args: '--bundles nsis' }
          # macOS（Apple Silicon + Intel）
          - { runner: macos-latest,    target: aarch64-apple-darwin,    label: macos-arm64, args: '' }
          - { runner: macos-latest,    target: x86_64-apple-darwin,     label: macos-x64, args: '' }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链（含目标平台）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.release_metadata.outputs.tag }}
          releaseName: MarkFlow ${{ needs.release_metadata.outputs.version }}
          # 发布说明内联维护（GITHUB_OUTPUT 多行 heredoc 在本仓库 runner 不可靠），
          # 发版时同步更新此处与 .github/release-notes/<version>.md。
          releaseBody: |
            ## MarkFlow ${{ needs.release_metadata.outputs.version }}

            ### 修复

            - 修复更新提示弹窗：超长更新说明现在可滚动查看，不再出现文字错位/重叠；说明改按 Markdown 渲染（标题/列表有排版），并对内容做 XSS 消毒。
            - 修复文件树不恢复：重新打开软件后自动恢复上次打开的文件夹及其展开状态，并定位到上次编辑的文件。
            - 修复文件夹判断逻辑：新增目录存在性检查（此前把文件夹误判为不存在，导致恢复失效）。
            - 修复切换文件夹联动：打开或切换文件夹后，若当前文档不属于新文件夹则自动复位编辑器（未保存草稿保留），不再残留旧文件夹内容。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}