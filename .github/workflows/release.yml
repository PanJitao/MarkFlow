name: release

# 推送语义化标签时触发，也可手动指定同格式标签。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.3.9'
        required: true
        type: string

permissions:
  contents: write   # 创建 / 上传 Release 资源所需

jobs:
  release_metadata:
    name: validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.release_notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z, for example v0.3.9."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes_file=".github/release-notes/${VERSION}.md"
          if [[ ! -s "$notes_file" ]]; then
            echo "Missing release notes: $notes_file"
            exit 1
          fi
          {
            echo 'notes<<EOF'
            cat "$notes_file"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: release_metadata
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # 单个平台失败不影响其它平台继续构建
      matrix:
        include:
          # Windows x64
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,  label: windows-x64 }
          # macOS（Apple Silicon + Intel）
          - { runner: macos-latest,    target: aarch64-apple-darwin,    label: macos-arm64 }
          - { runner: macos-latest,    target: x86_64-apple-darwin,     label: macos-x64 }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链（含目标平台）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.release_metadata.outputs.tag }}
          releaseName: ${{ needs.release_metadata.outputs.version }}
          releaseBody: ${{ needs.release_metadata.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
