name: release

# 推送语义化标签时触发，也可手动指定同格式标签。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.4.1'
        required: true
        type: string

permissions:
  contents: write   # 创建 / 上传 Release 资源所需

jobs:
  release_metadata:
    name: validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z, for example v0.4.1."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # tauri-action 对已存在的同名 Release 只上传资产、不更新 body（其源码行为），
      # 因此这里用 REST API 直接 PATCH 发布说明，保证重复发版时说明也同步更新。
      # 用 curl（runner 预装、状态码明确）替代 gh api（其 404 输出行为不可靠）。
      - name: 更新已存在 Release 的发布说明
        run: |
          set +e
          notes_file=".github/release-notes/${RELEASE_TAG#v}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error file=$notes_file::未找到版本发布说明文件，请先在 .github/release-notes/ 下创建后重新触发"
            exit 1
          fi
          api_base="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          body_file="$(mktemp)"
          # 导出说明为 JSON（node 在 runner 预装）
          node -e 'const fs=require("fs");fs.writeFileSync(process.argv[1], JSON.stringify({ body: fs.readFileSync(process.argv[2], "utf8") }))' "$body_file" "$notes_file"
          http_code="$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" -H "Accept: application/vnd.github+json" "${api_base}/releases/tags/${RELEASE_TAG}")"
          echo "DEBUG: GET releases/tags/${RELEASE_TAG} -> HTTP ${http_code}"
          if [ "$http_code" = "200" ]; then
            release_id="$(curl -s -H "$auth" -H "Accept: application/vnd.github+json" "${api_base}/releases/tags/${RELEASE_TAG}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(String(JSON.parse(s).id||""))}')"
            patch_code="$(curl -s -o /dev/null -w '%{http_code}' -X PATCH -H "$auth" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary "@${body_file}" "${api_base}/releases/${release_id}")"
            echo "DEBUG: PATCH releases/${release_id} -> HTTP ${patch_code}"
            if [ "$patch_code" = "200" ] || [ "$patch_code" = "201" ]; then
              echo "已更新 Release #${release_id} 的发布说明"
            else
              echo "::error::PATCH 发布说明失败（HTTP ${patch_code}）"
              exit 1
            fi
          else
            echo "Release 尚不存在（HTTP ${http_code}），说明将由 tauri-action 创建时写入"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  quality_gate:
    name: quality gate (typecheck + smoke + rust tests)
    needs: release_metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖（Tauri 编译所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 前端构建与素材校验
        run: |
          npm run build
          npm run test:pet-bundle

      - name: 编辑器、壁纸与桌面宠物回归
        run: |
          npm run test:workbench
          node scripts/test-selection-format.mjs
          node scripts/test-background.mjs
          node scripts/test-wallpaper.mjs
          npm run test:desktop-notes

      - name: 转换冒烟测试
        run: node scripts/smoke-convert.mjs

      - name: Rust 单元测试
        run: |
          output_file="$(mktemp)"
          if ! cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee "$output_file"; then
            # 编译错误尾部写入 annotation，页面 Annotations 区可直接查看
            summary="$(tail -n 80 "$output_file" | tr '\n' ' ' | cut -c1-1200)"
            echo "::error file=src-tauri/Cargo.toml::cargo test 失败：${summary}"
            exit 1
          fi

  publish:
    needs: [release_metadata, quality_gate]
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # 单个平台失败不影响其它平台继续构建
      matrix:
        include:
          # Windows x64
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,  label: windows-x64, args: '--bundles nsis' }
          # macOS（Apple Silicon + Intel）
          - { runner: macos-latest,    target: aarch64-apple-darwin,    label: macos-arm64, args: '' }
          - { runner: macos-latest,    target: x86_64-apple-darwin,     label: macos-x64, args: '' }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.tag }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链（含目标平台）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.release_metadata.outputs.tag }}
          releaseName: MarkFlow ${{ needs.release_metadata.outputs.version }}
          # 发布说明内联维护（GITHUB_OUTPUT 多行 heredoc 在本仓库 runner 不可靠），
          # 发版时同步更新此处与 .github/release-notes/<version>.md。
          releaseBody: |
            ## MarkFlow 0.4.6

            本次更新修复编辑器布局和分栏拖动，完善宠物关闭、独立便签窗口、更新入口及壁纸播放设置。

            ### 编辑器

            - 修复拖动源码与预览分割线时突然向右跳动的问题。文件树展开、收起或改变宽度后，分割线按鼠标移动距离调整，并保存分栏比例。
            - 修复顶部搜索命令框在最大化时偏离中央的问题，兼顾不同窗口宽度下的操作按钮布局。

            ### 宠物与便签

            - 宠物增加独立关闭按钮，并可从编辑器设置、文件菜单、便签窗口和系统托盘显示或关闭。
            - 编辑器右上角的“便签”直接打开独立便签窗口。文件菜单、设置和命令面板同时提供“在新窗口打开”与“切换到便签模式”。
            - 关闭宠物后，便签与待办继续可用，到时提醒可在便签窗口查看。宠物关闭状态会保存，待办提醒遵循该状态。
            - 后台运行时可从系统托盘重新打开编辑器、便签或宠物，也可退出软件。

            ### 更新与壁纸

            - 在“设置 → 应用更新”查看当前版本和检查结果。保留启动时自动检查，补充检查进度、失败重试提示及测试版的更新说明。
            - 在“设置 → 主题与外观”分别设置窗口失焦、最小化或隐藏后“继续播放”或“暂停播放”，选择会保存。
            - 本地视频、Wallpaper Engine 视频及网页、场景渲染使用同一播放策略，手动暂停优先。

            ### 升级与平台

            - Windows x64 提供 NSIS 安装包与 Tauri 更新签名。0.4.5 和 0.4.6-beta.1 / beta.2 可通过应用内检查更新升级。
            - macOS Apple Silicon 与 Intel 提供预览构建，仍需完成 Apple Developer ID 签名、公证和 Mac 真机验证。
            - Windows 已验证独立便签、宠物关闭、最大化布局、视频壁纸失焦播放和更新提示。构建与回归检查覆盖分栏、播放策略、旧数据兼容、便签保存和提醒。

            ### 来源与致谢

            - “蓝色大肥鱼”的 15 段动作素材引用自 [dsh-pet](https://github.com/PC2005-cloud/dsh-pet)，项目作者为 [PC2005-cloud](https://github.com/PC2005-cloud)。软件入口位于“设置 → 主题与外观 → 宠物样式与 AI 接入”，来源记录位于 `public/pets/dsh-blue/NOTICE.txt`。
            - 依据上游 README 的形象署名，原型“溟月”来自 [上善无形](https://space.bilibili.com/4456176)，DeepSeek 版设计来自 [ZipZipPipe](https://space.bilibili.com/4168597)。上游代码采用 MIT 许可，动画等素材按上游声明限非商业用途，形象遵循 CC BY-NC-SA 4.0。[上游许可说明](https://github.com/PC2005-cloud/dsh-pet#许可)
            - 壁纸参数面板参考 [elysia395/dsh-wallpaper-engine](https://github.com/elysia395/dsh-wallpaper-engine)，渲染采用 [oneincase/WebWallGL](https://github.com/oneincase/webwallgl)，包含 [Vanilagy/Mediabunny](https://github.com/Vanilagy/mediabunny) 媒体组件。许可和来源随安装包提供。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}
