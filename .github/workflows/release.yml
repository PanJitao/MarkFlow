name: release

# 打 Version_* / v* 标签时触发，也可手动运行
on:
  push:
    tags:
      - 'Version_*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 / 上传 Release 资源所需

jobs:
  publish:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # 单个平台失败不影响其它平台继续构建
      matrix:
        include:
          # Windows x64
          - { runner: windows-latest,  target: x86_64-pc-windows-msvc,  label: windows-x64 }
          # macOS（Apple Silicon + Intel）
          - { runner: macos-latest,    target: aarch64-apple-darwin,    label: macos-arm64 }
          - { runner: macos-latest,    target: x86_64-apple-darwin,     label: macos-x64 }

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链（含目标平台）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'ExchangeMD ${{ github.ref_name }} —— Windows x64、macOS Apple Silicon 与 macOS Intel 构建。新增编辑区隐藏、预览复制增强和双向同步滚动。'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
