<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src-tauri/icons/128x128.png" />
    <title>MarkFlow 文档转换工作台</title>
  </head>
  <body>
    <div id="custom-background" class="custom-background" aria-hidden="true">
      <img id="background-image" alt="" />
      <video id="background-video" muted loop autoplay playsinline></video>
    </div>

    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="/src-tauri/icons/128x128.png" alt="" aria-hidden="true" />
          <div class="brand-text">
            <h1>MarkFlow</h1>
            <p>文档转换工作台</p>
          </div>
        </div>

        <nav class="actions" aria-label="文件与转换操作">
          <div class="action-group">
            <span class="group-label">文件</span>
            <button data-file="open-md" title="打开 .md 文件">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm9 1.5V9h3.5L14 5.5z" fill="currentColor"/></svg>
              打开 MD
            </button>
            <button data-file="save-md" title="保存为 .md 文件">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8l-4-4H5zm3 3h6v5H8V7zm-1 9h10v1H7v-1z" fill="currentColor"/></svg>
              保存 MD
            </button>
          </div>

          <div class="action-divider" aria-hidden="true"></div>

          <div class="action-group">
            <span class="group-label">转换为</span>
            <button data-file="docx-to-md" data-convert title="把 Word 文档转成 Markdown">Word 转 MD</button>
            <button data-file="xlsx-to-md" data-convert title="把 Excel 表格转成 Markdown">Excel 转 MD</button>
            <button data-file="md-to-docx" data-convert title="选择 md 文件并导出为 Word">MD 转 Word</button>
            <button class="primary" data-file="export-html" data-convert title="选择 md 文件并导出为 HTML">导出 HTML</button>
          </div>
        </nav>

        <div class="settings-wrap">
          <button id="settings-btn" class="settings-btn" title="设置" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 3 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1c.6.5 1.3.9 2 1.2l.4 2.5h4l.4-2.5c.7-.3 1.4-.7 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" fill="currentColor"/></svg>
            设置
          </button>
          <div id="settings-menu" class="settings-menu" role="menu" aria-label="系统设置">
            <button id="appearance-settings-btn" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.4a1.6 1.6 0 0 0 0-3.2h-1a1.4 1.4 0 0 1 0-2.8H14a7 7 0 0 0 0-14h-2zm-4 7.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4-2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4 2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="currentColor"/></svg>
              外观设置
            </button>
            <div class="menu-separator" role="separator"></div>
            <button role="menuitem" data-setting="open-with">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7M17 14l4 3-4 3v-6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              加入右键「打开方式」
            </button>
            <button role="menuitem" data-setting="default-app">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l14 8-14 8V4z" fill="currentColor"/></svg>
              设为默认 Markdown 程序
            </button>
            <p class="menu-hint">注册到本机用户账户，无需管理员权限；设置默认需在弹出的系统页面确认。</p>
          </div>
        </div>
      </header>

      <section class="toolbar" role="toolbar" aria-label="Markdown 格式">
        <button class="icon-btn" data-action="h1" aria-label="一级标题" title="一级标题">H1</button>
        <button class="icon-btn" data-action="h2" aria-label="二级标题" title="二级标题">H2</button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="icon-btn" data-action="bold" aria-label="加粗 (Ctrl+B)" title="加粗 (Ctrl+B)"><strong>B</strong></button>
        <button class="icon-btn" data-action="italic" aria-label="斜体 (Ctrl+I)" title="斜体 (Ctrl+I)"><em>I</em></button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button data-action="list" title="无序列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>列表</button>
        <button data-action="quote" title="引用"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2v3a3 3 0 0 1-3 3M20 7h-3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2v3a3 3 0 0 1-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>引用</button>
        <button data-action="table" title="插入表格"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M3 15h18M9 5v14M15 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>表格</button>
        <button data-action="code" title="代码块"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>代码</button>
        <button data-action="link" title="插入链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>链接</button>
        <span class="toolbar-spacer" aria-hidden="true"></span>
        <button id="editor-toggle-btn" aria-controls="editor-panel" aria-expanded="true" title="隐藏编辑区">
          <svg class="editor-hide-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3v18M16 9l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="editor-show-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3v18M13 9l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="editor-toggle-label">隐藏编辑区</span>
        </button>
        <button id="copy-btn" title="复制 Markdown 源码"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>复制</button>
        <span class="shortcut-hint">Ctrl+B 加粗 · Ctrl+I 斜体 · Tab 缩进</span>
      </section>

      <section class="workspace" id="workspace">
        <article class="panel editor-panel" id="editor-panel">
          <div class="panel-header">
            <h2>编辑器</h2>
            <span id="file-label">未保存的草稿 · Markdown 源码</span>
          </div>
          <textarea id="editor" spellcheck="false" placeholder="在这里输入 Markdown 内容…" aria-label="Markdown 编辑器"></textarea>
        </article>

        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="拖动调整编辑器与预览宽度" tabindex="0"></div>

        <article class="panel preview-panel">
          <div class="panel-header">
            <h2>预览</h2>
            <span>实时渲染</span>
          </div>
          <div id="preview" aria-label="Markdown 预览"></div>
        </article>
      </section>

      <footer class="statusbar">
        <span class="spinner" id="spinner" aria-hidden="true"></span>
        <span id="status" role="status" aria-live="polite">就绪</span>
        <span class="status-right">
          <span id="word-count">0 字</span>
          <span id="zoom-level" aria-label="内容显示比例 100%">100%</span>
        </span>
      </footer>
    </div>

    <dialog id="appearance-dialog" class="appearance-dialog" aria-labelledby="appearance-title">
      <form method="dialog">
        <header class="appearance-header">
          <h2 id="appearance-title">外观设置</h2>
          <button class="appearance-close icon-btn" value="close" aria-label="关闭外观设置" title="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </header>

        <div class="appearance-body">
          <div class="appearance-media-row">
            <div class="appearance-media-copy">
              <span class="appearance-label">背景素材</span>
              <span id="background-file-name" class="appearance-value" title="未选择背景素材">未选择</span>
            </div>
            <div class="appearance-media-actions">
              <button type="button" id="choose-background-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6l2 2h8v10H4V6zm2 3v7h12v-6h-7l-2-2H6v1z" fill="currentColor"/></svg>
                选择
              </button>
              <button type="button" id="clear-background-btn" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M9 7V4h6v3m-8 0 1 13h8l1-13M10 10v7m4-7v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                清除
              </button>
            </div>
            <input id="background-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm" hidden />
          </div>

          <label class="appearance-control" for="background-color-input">
            <span class="appearance-label">背景底色</span>
            <input id="background-color-input" class="color-swatch" type="color" value="#efe4d6" />
          </label>

          <label class="appearance-control appearance-range" for="background-opacity-input">
            <span class="appearance-label">背景不透明度</span>
            <span class="range-wrap">
              <input id="background-opacity-input" type="range" min="0" max="100" step="5" value="100" />
              <output id="background-opacity-value" for="background-opacity-input">100%</output>
            </span>
          </label>

          <label class="appearance-control appearance-range" for="panel-opacity-input">
            <span class="appearance-label">面板与按钮不透明度</span>
            <span class="range-wrap">
              <input id="panel-opacity-input" type="range" min="5" max="100" step="1" value="94" />
              <output id="panel-opacity-value" for="panel-opacity-input">94%</output>
            </span>
          </label>

          <div class="appearance-control">
            <span id="panel-blur-label" class="appearance-label">面板背景模糊</span>
            <button
              type="button"
              id="panel-blur-toggle"
              class="appearance-switch"
              role="switch"
              aria-checked="true"
              aria-labelledby="panel-blur-label panel-blur-value"
            >
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span id="panel-blur-value" class="switch-value">开启</span>
            </button>
          </div>

          <label class="appearance-control" for="button-text-color-input">
            <span class="appearance-label">按钮文字</span>
            <input id="button-text-color-input" class="color-swatch" type="color" value="#20262e" />
          </label>

          <label class="appearance-control" for="editor-color-input">
            <span class="appearance-label">编辑器字体</span>
            <input id="editor-color-input" class="color-swatch" type="color" value="#1f1b15" />
          </label>

          <label class="appearance-control" for="preview-color-input">
            <span class="appearance-label">预览字体</span>
            <input id="preview-color-input" class="color-swatch" type="color" value="#282016" />
          </label>
        </div>

        <footer class="appearance-footer">
          <button type="button" id="reset-appearance-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            恢复默认
          </button>
          <button class="primary" value="done">完成</button>
        </footer>
      </form>
    </dialog>

    <dialog id="update-dialog" class="appearance-dialog update-dialog" aria-labelledby="update-title">
      <form method="dialog">
        <header class="appearance-header">
          <h2 id="update-title">发现新版本</h2>
        </header>
        <div class="update-body">
          <p id="update-version" class="update-version"></p>
          <p id="update-status" class="update-status"></p>
          <progress id="update-progress" max="100" value="0" aria-label="更新下载进度"></progress>
        </div>
        <footer class="appearance-footer">
          <button type="button" id="update-later-btn">稍后</button>
          <button type="button" id="update-confirm-btn" class="primary">下载并安装</button>
        </footer>
      </form>
    </dialog>

    <div id="editor-context-menu" class="editor-context-menu" role="menu" aria-label="编辑器右键菜单" hidden>
      <button type="button" data-context-action="copy" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        复制
      </button>
      <button type="button" data-context-action="paste" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h6M9 3h6v4H9zM6 7h12v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        粘贴
      </button>
      <button type="button" data-context-action="format-json" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M9 5v14M15 5v14M7 19h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        格式化 JSON
      </button>
      <button type="button" data-context-action="table" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M3 15h18M9 5v14M15 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        插入表格
      </button>
      <div class="editor-context-submenu-wrap">
        <button type="button" class="context-menu-trigger" data-context-submenu="code" aria-haspopup="menu" aria-expanded="false" role="menuitem">
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>插入代码块</span>
          <svg class="context-menu-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="editor-context-submenu context-code-menu" role="menu" aria-label="代码语言">
          <button type="button" data-context-code="text" role="menuitem">纯文本</button>
          <button type="button" data-context-code="json" role="menuitem">JSON</button>
          <button type="button" data-context-code="python" role="menuitem">Python</button>
          <button type="button" data-context-code="java" role="menuitem">Java</button>
          <button type="button" data-context-code="javascript" role="menuitem">JavaScript</button>
          <button type="button" data-context-code="node" role="menuitem">Node.js</button>
          <button type="button" data-context-code="c" role="menuitem">C</button>
          <button type="button" data-context-code="cpp" role="menuitem">C++</button>
          <button type="button" data-context-code="csharp" role="menuitem">C#</button>
          <button type="button" data-context-code="sql" role="menuitem">SQL</button>
          <button type="button" data-context-code="powershell" role="menuitem">PowerShell</button>
          <button type="button" data-context-code="cmd" role="menuitem">CMD / BAT</button>
        </div>
      </div>
      <button type="button" data-context-action="quote" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2v3a3 3 0 0 1-3 3M20 7h-3a1 1 0 0 0-1 1v4a1 1 0 0 1 1 1h2v3a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        插入引用
      </button>
    </div>

    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
