<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarkFlow 桌面宠物</title></head>
<body class="pet-page">
  <section id="speech" class="pet-speech" data-interactive hidden role="status" aria-live="polite">
    <div class="speech-heading"><span id="speech-caption">MarkFlow 小助手</span><button id="speech-close" type="button" aria-label="收起气泡">×</button></div>
    <p id="speech-text"></p><small id="speech-time"></small>
    <div id="speech-actions" hidden><button id="alert-done">完成</button><button id="alert-snooze">10 分钟后</button><button id="alert-dismiss">知道了</button><button id="alert-next" hidden>下一条</button></div>
  </section>
  <div id="pet-menu" class="pet-menu" data-interactive hidden role="menu" aria-label="宠物菜单">
    <button role="menuitem" data-pet-action="notes">便签与待办</button>
    <div class="menu-line"></div><span class="pet-menu-label">互动动作</span>
    <div class="pet-action-grid"><button role="menuitem" data-pet-action="wave">挥挥手</button><button role="menuitem" data-pet-action="stretch">伸懒腰</button><button role="menuitem" data-pet-action="play">玩魔方</button><button role="menuitem" data-pet-action="sleep">打个盹</button></div>
    <div id="pet-extra-controls" hidden><select id="pet-extra-action" aria-label="自定义动作"></select><button id="pet-extra-play">播放动作</button></div>
    <div class="menu-line"></div>
    <button role="menuitem" data-pet-action="demo">预览提醒气泡</button><button role="menuitem" data-pet-action="pet-settings">宠物样式与 AI 接入</button><button role="menuitem" data-pet-action="editor">返回编辑器</button>
    <div class="menu-line"></div><button role="menuitem" data-pet-action="disable">关闭便签模式</button><button role="menuitem" data-pet-action="quit">退出软件</button>
    <small id="pet-credit" class="pet-credit">动画素材：dsh-pet · MIT</small>
  </div>
  <div id="pet" class="pet" data-action="idle">
    <div id="pet-stage" class="pet-stage"><img id="pet-poster" src="./pets/dsh-blue/poster.png" alt="蓝发桌面小伙伴" draggable="false"></div>
    <button id="pet-open" class="pet-hit-area" data-interactive aria-label="与宠物互动，双击打开便签，拖动可移动" title="点击互动 · 双击打开便签 · 拖动移动 · 右键菜单"></button>
    <div class="pet-controls" data-interactive><button id="pet-count" aria-label="打开便签与待办">便签 · 0 待办</button><button id="pet-menu-toggle" aria-label="宠物菜单" aria-expanded="false">···</button></div>
  </div>
  <script type="module" src="/src/pet.ts"></script>
</body></html>
