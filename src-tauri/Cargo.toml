[package]
name = "markflow"
version = "0.4.5"
description = "MarkFlow 文档转换工作台"
authors = ["MarkFlow"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico", "protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pathdiff = "0.2"
trash = "5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
anydoc = "0.1.9"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
# 默认编译时使用本地前端产物
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
